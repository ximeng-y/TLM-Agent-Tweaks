name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 / 单测 / 产物校验 / 服务端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 两个薄壳的 toolchain 不同：common/neoforge 用 21，forge（1.20.1）用 17
      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # 仓库不携带 gradle wrapper（沿用本地惯例），由本步骤提供 8.14.2
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 配置 CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          # 仓库内 gradle.properties 记的是本机 Windows JDK 路径，CI 上不存在；
          # 先删掉（项目级配置优先级高于用户级，留着会覆盖下面的设置），再写入 runner 实际路径。
          sed -i '/^org\.gradle\.java\.installations\.paths=/d' gradle.properties
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          printf '%s\n' "org.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" \
            >> "$gradle_user_home/gradle.properties"

      - name: 编译与单测
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace :common:test build

      # 编译通过不等于产物正确，这里校验 jar 内容（mixin 声明、refmap、mods.toml 展开、两侧 assets 一致等）
      - name: 校验产物
        shell: bash
        run: python3 .github/scripts/verify_jars.py

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tlm-agent-tweaks-jars
          path: |
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      # 开发服务端冒烟：编译期抓不到 mixin 目标缺失、注入描述符不符等问题，只有真正起一次服务端才会暴露
      - name: 服务端冒烟
        shell: bash
        run: |
          set -uo pipefail
          failed=""
          for loader in neoforge forge; do
            bash .github/scripts/smoke_server.sh "$loader" 420 || failed="$failed $loader"
          done
          if [[ -n "$failed" ]]; then
            echo "::error::以下加载器的服务端冒烟未通过：$failed"
            exit 1
          fi
