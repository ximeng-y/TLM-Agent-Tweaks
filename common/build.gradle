// common：纯 Java 统计引擎，零 Minecraft/加载器 import（仅 Gson + slf4j，双端 MC 运行时内置）
// neoforge/forge 薄壳通过 sourceSets.java.srcDir 并入本模块源码编译（不产独立 jar）

plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}" as int)
}

dependencies {
    compileOnly "com.google.code.gson:gson:${gson_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation "org.slf4j:slf4j-api:${slf4j_version}"
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.13'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
